spring.application.name=access
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
server.port=8081
jwt.public.key=${JWT_PUBLIC_KEY:classpath:public.key}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=1000
app.kafka.ack-timeout-ms=5000
app.outbox.poll-interval-ms=1000
app.kafka.attendance-topic=attendance
qr.ttl-seconds=60
# Required, unless the demo profile is active: then an empty value means requests to open a gate are only logged.
turnstile.api.base-url=${TURNSTILE_API_BASE_URL:}
turnstile.api.open-gate-path=/gates/open
turnstile.api.timeout-ms=1000
