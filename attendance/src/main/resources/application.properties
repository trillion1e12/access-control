spring.application.name=attendance
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
jwt.public.key=${JWT_PUBLIC_KEY:classpath:public.key}
jwt.private.key=${JWT_PRIVATE_KEY:classpath:private.key}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.attendance-topic=attendance
app.kafka.attendance-dead-letter-topic=attendance.dead-letter
app.kafka.attendance-group=attendance-service
