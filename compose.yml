# "docker compose up -d" starts only the database and Kafka, for running the services with gradlew.
# "docker compose --profile app up -d --build" also builds and starts both services behind Nginx.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    logging: *logging
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST is for services started with gradlew, DOCKER is for services in this compose file.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  attendance:
    logging: *logging
    profiles: ["app"]
    build: ./attendance
    environment:
      DB_URL: jdbc:postgresql://db:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_PUBLIC_KEY: file:/run/keys/public.key
      JWT_PRIVATE_KEY: file:/run/keys/private.key
    volumes:
      - ./keys:/run/keys:ro
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 3s
      retries: 30

  access:
    logging: *logging
    profiles: ["app"]
    build: ./access
    environment:
      DB_URL: jdbc:postgresql://db:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_PUBLIC_KEY: file:/run/keys/public.key
      # Under the demo profile, an empty TURNSTILE_API_BASE_URL means requests to open a gate are only logged.
      SPRING_PROFILES_ACTIVE: ${ACCESS_PROFILES:-demo}
      TURNSTILE_API_BASE_URL: ${TURNSTILE_API_BASE_URL:-}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
    volumes:
      - ./keys/public.key:/run/keys/public.key:ro
    depends_on:
      # Starts after attendance so that only one service creates the shared tables.
      attendance:
        condition: service_healthy
    healthcheck:
      # The readiness probe also reports the database; curl -f fails on any status of 400 or more.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  nginx:
    logging: *logging
    profiles: ["app"]
    image: nginx:stable
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro
      - ./certs/ca.crt:/etc/nginx/certs/ca.crt:ro
    ports:
      - "8443:443"
    depends_on:
      attendance:
        condition: service_healthy
      access:
        condition: service_healthy
