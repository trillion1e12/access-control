# Single entry point: terminates TLS and routes each request to the service that owns the path.
events {}

http {
    upstream attendance-service {
        server attendance:8080;
    }

    upstream access-service {
        server access:8081;
    }

    # The request id is passed on to the services and logged with the client certificate name.
    log_format tmc '$remote_addr [$time_local] "$request" $status rid=$request_id client="$ssl_client_s_dn"';
    access_log /dev/stdout tmc;

    # A scan (POST /qr-codes) is only accepted from a client that presented a certificate
    # signed by the TMC certificate authority; other requests need no client certificate.
    map "$request_method:$ssl_client_verify" $scan_without_certificate {
        default 0;
        "POST:SUCCESS" 0;
        "~^POST:" 1;
    }

    server {
        listen 443 ssl;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client optional;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # Always overwritten here, so a client cannot claim a certificate it did not present.
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Subject $ssl_client_s_dn;

        location /users {
            proxy_pass http://attendance-service;
        }

        location /attendances {
            proxy_pass http://attendance-service;
        }

        location /qr-codes {
            if ($scan_without_certificate) {
                return 403;
            }
            proxy_pass http://access-service;
        }

        location / {
            return 404;
        }
    }
}
